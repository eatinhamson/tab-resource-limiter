<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #202124; }
    h1 { font-size: 15px; margin: 0; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .switch { position: relative; width: 38px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .track { position: absolute; inset: 0; cursor: pointer; border-radius: 11px; background: #9aa0a6; transition: .15s; }
    .track::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: white; transition: .15s; }
    .switch input:checked + .track { background: #1a73e8; }
    .switch input:checked + .track::before { transform: translateX(16px); }
    .control { padding: 10px; margin-bottom: 12px; background: #f1f3f4; border-radius: 8px; }
    .control.disabled { opacity: .5; }
    .label-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
    input[type="range"] { width: 100%; margin: 9px 0 3px; }
    .range-ends { display: flex; justify-content: space-between; color: #70757a; font-size: 10px; }
    #host { font-weight: 600; word-break: break-all; }
    #status { margin: 8px 0; font-size: 12px; color: #555; }
    button { width: 100%; padding: 8px; margin-top: 6px; cursor: pointer; }
    a { display: block; margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Tab Resource Limiter</h1>
    <label class="switch" title="Turn limiting on or off">
      <input id="master" type="checkbox" aria-label="Enable resource limiting">
      <span class="track"></span>
    </label>
  </div>
  <div id="strengthControl" class="control" hidden>
    <div class="label-row"><span>Strength for this site</span><span id="strengthValue">100%</span></div>
    <input id="strength" type="range" min="10" max="100" step="10" value="100">
    <div class="range-ends"><span>Lighter</span><span>Configured maximum</span></div>
  </div>
  <div id="host">…</div>
  <div id="status"></div>
  <button id="toggle" hidden></button>
  <a href="#" id="options">Edit all rules…</a>
  <script src="popup.js"></script>
</body>
</html>
